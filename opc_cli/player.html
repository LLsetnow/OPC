<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Qwen3-TTS 流式播放器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0f0f0f; color: #e0e0e0; min-height: 100vh;
         display: flex; justify-content: center; align-items: stretch; padding: 16px; }
  .page { max-width: 1100px; width: 100%; display: flex; gap: 16px; height: calc(100vh - 32px); }
  .left-panel { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: hidden; }
  .right-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #4fc3f7; }
  .form-group { margin-bottom: 8px; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
  textarea, select, input[type=text] {
    width: 100%; padding: 8px 12px; border-radius: 6px;
    border: 1px solid #333; background: #1a1a1a; color: #e0e0e0;
    font-size: 14px; outline: none;
  }
  textarea:focus, select:focus, input:focus { border-color: #4fc3f7; }
  textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > .form-group { flex: 1; min-width: 120px; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px;
    transition: all .2s;
  }
  #btnGenerate { background: #4fc3f7; color: #000; }
  #btnGenerate:hover { background: #81d4fa; }
  #btnGenerate:disabled { background: #555; color: #888; cursor: not-allowed; }
  #btnStop { background: #ef5350; color: #fff; display: none; }
  #btnStop:hover { background: #f44336; }
  .status {
    flex: 1; padding: 12px; border-radius: 8px;
    background: #1a1a1a; border: 1px solid #333; font-size: 13px;
    overflow-y: auto;
  }
  .status .log { padding: 2px 0; }
  .log.info { color: #4fc3f7; }
  .log.ok { color: #66bb6a; }
  .log.err { color: #ef5350; }
  .log.dim { color: #888; }
  .waveform { height: 60px; background: #1a1a1a;
              border-radius: 8px; border: 1px solid #333; overflow: hidden; }
  canvas { width: 100%; height: 100%; }
  .divider { border: none; border-top: 1px solid #333; margin: 4px 0; }
  .chat-box {
    background: #1a1a1a; border-radius: 8px; border: 1px solid #333;
    padding: 12px; flex: 1; overflow-y: auto;
    font-size: 14px; line-height: 1.6;
  }
  .chat-msg { padding: 4px 0; }
  .chat-msg.user { color: #81d4fa; }
  .chat-msg.assistant { color: #a5d6a7; }
  .chat-msg .label { font-weight: 600; margin-right: 6px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; }
  .input-row button { width: auto; padding: 8px 16px; margin-top: 0; }
  #btnChat { background: #66bb6a; color: #000; }
  #btnChat:hover { background: #81c784; }
  #btnChat:disabled { background: #555; color: #888; cursor: not-allowed; }
  .section-title { font-size: 16px; color: #4fc3f7; margin-bottom: 4px; font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <!-- 左侧：功能控件 -->
  <div class="left-panel">
    <h1>Qwen3-TTS 流式播放器</h1>
    <div class="section-title">AI 语音对话</div>
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')startChat()">
      <button id="btnChat" onclick="startChat()">发送</button>
    </div>
    <hr class="divider">
    <div class="form-group">
      <label>输入文本</label>
      <textarea id="text" placeholder="输入要合成的文本...">你好，我是 Qwen3 语音合成引擎，正在通过 WebSocket 流式播放音频。</textarea>
    </div>
    <div class="row">
      <div class="form-group">
        <label>引擎</label>
        <select id="engine" onchange="onEngineChange()">
          <option value="local">本地 Qwen3-TTS</option>
          <option value="qwen-tts">阿里云 CosyVoice</option>
        </select>
      </div>
      <div class="form-group">
        <label>模式</label>
        <select id="mode" onchange="if($('engine').value==='qwen-tts')onQwenModelChange()">
          <option value="custom">CustomVoice（预设音色）</option>
          <option value="design">VoiceDesign（设计音色）</option>
          <option value="base">Base（语音克隆）</option>
        </select>
      </div>
      <div class="form-group">
        <label>音色</label>
        <select id="speaker">
          <option value="Vivian">Vivian（明亮女声）</option>
          <option value="Serena">Serena（温柔女声）</option>
          <option value="Uncle_Fu">Uncle_Fu（低音男声）</option>
          <option value="Dylan">Dylan（京腔男声）</option>
          <option value="Eric">Eric（川普男声）</option>
          <option value="Ryan">Ryan（英语男声）</option>
          <option value="Aiden">Aiden（美式男声）</option>
          <option value="Ono_Anna">Ono_Anna（日语女声）</option>
          <option value="Sohee">Sohee（韩语女声）</option>
        </select>
      </div>
      <div class="form-group">
        <label>语言</label>
        <select id="language">
          <option value="Chinese">中文</option>
          <option value="English">English</option>
          <option value="Japanese">日本語</option>
          <option value="Korean">한국어</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>指令（可选，控制语气/情感）</label>
      <input type="text" id="instruct" placeholder="如：用温柔的语气说">
    </div>
    <button id="btnGenerate" onclick="startGenerate()">生成 & 播放</button>
    <button id="btnStop" onclick="stopGenerate()">停止</button>
    <div class="waveform"><canvas id="canvas"></canvas></div>
  </div>

  <!-- 右侧：日志 + 对话 -->
  <div class="right-panel">
    <div class="section-title">运行日志</div>
    <div class="status" id="status"><div class="log dim">等待输入...</div></div>
    <hr class="divider">
    <div class="section-title">对话记录</div>
    <div class="chat-box" id="chatBox">
      <div class="chat-msg dim">与 AI 对话，回复将自动转为语音播放...</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws = null, audioCtx = null, isPlaying = false, nextPlayTime = 0;
let _reqStart = 0;    // 请求发起时间
let _firstChunk = 0;  // 首个音频块到达时间
let _llmFirst = 0;    // LLM 首次返回文本时间
const _sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

// 音色列表
const LOCAL_SPEAKERS = [
  {value:"Vivian", label:"Vivian（明亮女声）"},
  {value:"Serena", label:"Serena（温柔女声）"},
  {value:"Uncle_Fu", label:"Uncle_Fu（低音男声）"},
  {value:"Dylan", label:"Dylan（京腔男声）"},
  {value:"Eric", label:"Eric（川普男声）"},
  {value:"Ryan", label:"Ryan（英语男声）"},
  {value:"Aiden", label:"Aiden（美式男声）"},
  {value:"Ono_Anna", label:"Ono_Anna（日语女声）"},
  {value:"Sohee", label:"Sohee（韩语女声）"},
];
const QWEN_SYSTEM_SPEAKERS_V2 = [
  {value:"longxiaochun_v2", label:"龙小淳（知性积极女）"},
  {value:"longxiaoxia_v2", label:"龙小夏（沉稳权威女）"},
  {value:"longyumi_v2", label:"YUMI（正经青年女）"},
  {value:"longlaotie_v2", label:"龙老铁（东北直率男）"},
  {value:"longshuo_v2", label:"龙硕（博才干练男）"},
  {value:"longyue_v2", label:"龙悦（温暖磁性女）"},
  {value:"longhua_v2", label:"龙华（元气甜美女）"},
  {value:"longfei_v2", label:"龙飞（热血磁性男）"},
];
const QWEN_SYSTEM_SPEAKERS_V3 = [
  {value:"longanyang", label:"龙安洋（阳光大男孩）★"},
  {value:"longanhuan", label:"龙安欢（欢脱元气女）"},
  {value:"longxiaochun_v3", label:"龙小淳（知性积极女）"},
  {value:"longxiaoxia_v3", label:"龙小夏（沉稳权威女）"},
  {value:"longyumi_v3", label:"YUMI（正经青年女）"},
  {value:"longhua_v3", label:"龙华（元气甜美女）"},
  {value:"longfeifei_v3", label:"龙菲菲（甜美娇气女）★"},
  {value:"longanrou_v3", label:"龙安柔（温柔闺蜜女）"},
  {value:"longze_v3", label:"龙泽（温暖元气男）"},
  {value:"longfei_v3", label:"龙飞（热血磁性男）"},
  {value:"longlaotie_v3", label:"龙老铁（东北直率男）"},
  {value:"longanyue_v3", label:"龙安粤（欢脱粤语男）"},
  {value:"longhuhu_v3", label:"龙呼呼（天真女童）"},
  {value:"longshuo_v3", label:"龙硕（博才干练男）"},
  {value:"longmiao_v3", label:"龙妙（抑扬顿挫女）"},
];
const QWEN_CLONE_SPEAKERS = [
  {value:"1a855e6f-15a4-4693-9a1f-7ce8d528350b", label:"洛琪希（复刻）"},
  {value:"e9b734d3-5ed8-4376-bfcc-6372bfdc25e0", label:"菲比（复刻）"},
];

function onEngineChange() {
  const engine = $('engine').value;
  const speakerEl = $('speaker');
  const modeEl = $('mode');
  const langEl = $('language');
  const instructEl = $('instruct');
  const isQwen = engine === 'qwen-tts';
  langEl.disabled = isQwen;
  if (isQwen) {
    // 替换模式选项为 CosyVoice 模型
    modeEl.innerHTML = '';
    modeEl.disabled = false;
    const models = [
      {value: 'cosyvoice-v3.5-flash', label: 'CosyVoice v3.5 Flash'},
      {value: 'cosyvoice-v3-flash', label: 'CosyVoice v3 Flash'},
    ];
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.textContent = m.label;
      modeEl.appendChild(opt);
    });
    langEl.value = 'Chinese';
    onQwenModelChange(); // 更新音色列表
  } else {
    // 恢复本地模式选项
    modeEl.innerHTML = '';
    const localModes = [
      {value: 'custom', label: 'CustomVoice（预设音色）'},
      {value: 'design', label: 'VoiceDesign（设计音色）'},
      {value: 'base', label: 'Base（语音克隆）'},
    ];
    localModes.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.textContent = m.label;
      modeEl.appendChild(opt);
    });
    modeEl.disabled = false;
    // 本地音色列表
    speakerEl.innerHTML = '';
    LOCAL_SPEAKERS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      speakerEl.appendChild(opt);
    });
  }
}

function onQwenModelChange() {
  const model = $('mode').value; // qwen-tts 时 mode 栏显示的是模型
  const speakerEl = $('speaker');
  speakerEl.innerHTML = '';
  if (model === 'cosyvoice-v3.5-flash') {
    // v3.5-flash 无系统音色，仅复刻/设计音色
    QWEN_CLONE_SPEAKERS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      speakerEl.appendChild(opt);
    });
    if (QWEN_CLONE_SPEAKERS.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '⚠ 无可用音色（需创建复刻音色）';
      speakerEl.appendChild(opt);
    }
  } else if (model === 'cosyvoice-v3-flash') {
    // v3-flash：系统音色(v3) + 复刻音色
    QWEN_SYSTEM_SPEAKERS_V3.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      speakerEl.appendChild(opt);
    });
    QWEN_CLONE_SPEAKERS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      speakerEl.appendChild(opt);
    });
  } else {
    // v2 等旧模型：v2 系统音色 + 复刻音色
    QWEN_SYSTEM_SPEAKERS_V2.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      speakerEl.appendChild(opt);
    });
    QWEN_CLONE_SPEAKERS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      speakerEl.appendChild(opt);
    });
  }
}

// 从服务器动态加载复刻音色（覆盖硬编码的 UUID）
async function loadCloneSpeakersFromServer() {
  try {
    const resp = await fetch('/speakers?engine=qwen-tts');
    if (!resp.ok) return;
    const data = await resp.json();
    // 筛选出复刻音色（不在 V2/V3 系统音色列表中的）
    const v2Keys = new Set(QWEN_SYSTEM_SPEAKERS_V2.map(s => s.value));
    const v3Keys = new Set(QWEN_SYSTEM_SPEAKERS_V3.map(s => s.value));
    const systemKeys = new Set([...v2Keys, ...v3Keys]);
    const cloneSpeakers = Object.entries(data)
      .filter(([k]) => !systemKeys.has(k))
      .map(([value, label]) => ({value, label}));
    if (cloneSpeakers.length > 0) {
      QWEN_CLONE_SPEAKERS.length = 0;
      cloneSpeakers.forEach(s => QWEN_CLONE_SPEAKERS.push(s));
      console.log('已从服务器加载复刻音色:', cloneSpeakers.map(s => s.label));
      // 重新渲染音色下拉菜单，使新 voice_id 生效
      onEngineChange();
    }
  } catch(e) {
    console.log('从服务器加载复刻音色失败，使用本地配置', e);
  }
}
loadCloneSpeakersFromServer();

function log(msg, cls = 'info') {
  const d = document.createElement('div');
  d.className = 'log ' + cls;
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  $('status').appendChild(d);
  $('status').scrollTop = $('status').scrollHeight;
}

// 简单波形绘制
const canvas = $('canvas'), ctx2d = canvas.getContext('2d');
let samples = [];

function drawWaveform() {
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = canvas.offsetHeight * 2;
  ctx2d.fillStyle = '#1a1a1a';
  ctx2d.fillRect(0, 0, w, h);
  if (samples.length === 0) {
    ctx2d.strokeStyle = '#333';
    ctx2d.beginPath(); ctx2d.moveTo(0, h/2); ctx2d.lineTo(w, h/2); ctx2d.stroke();
    return;
  }
  ctx2d.strokeStyle = '#4fc3f7';
  ctx2d.lineWidth = 1.5;
  ctx2d.beginPath();
  const step = Math.max(1, Math.floor(samples.length / w));
  for (let i = 0; i < w; i++) {
    const s = samples[i * step] || 0;
    const y = (1 - s) * h / 2;
    i === 0 ? ctx2d.moveTo(i, y) : ctx2d.lineTo(i, y);
  }
  ctx2d.stroke();
}

function playPCM(float32Array, sampleRate) {
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate });
  const buffer = audioCtx.createBuffer(1, float32Array.length, sampleRate);
  buffer.getChannelData(0).set(float32Array);
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  // 排队调度：确保每个块在前一个播完后才开始，避免重叠
  const now = audioCtx.currentTime;
  if (now > nextPlayTime) nextPlayTime = now;
  source.start(nextPlayTime);
  nextPlayTime += buffer.duration;

  // 更新波形
  samples = samples.concat(Array.from(float32Array));
  if (samples.length > 48000) samples = samples.slice(-48000);
  drawWaveform();
}

function startGenerate() {
  const text = $('text').value.trim();
  if (!text) { log('请输入文本', 'err'); return; }
  if (isPlaying) { log('正在播放中...', 'err'); return; }

  const wsPort = window.location.port;  // HTTP port
  const port = parseInt(wsPort) + 1;    // WS port = HTTP + 1
  const wsUrl = 'ws://' + window.location.hostname + ':' + port + '/ws/generate';

  isPlaying = true;
  nextPlayTime = 0;
  samples = [];
  drawWaveform();
  $('btnGenerate').disabled = true;
  $('btnStop').style.display = 'block';
  log('连接 WebSocket: ' + wsUrl);

  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  let sampleRate = 24000;

  // 预初始化 AudioContext（浏览器要求用户手势后才能创建）
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 24000 });

  ws.onopen = () => {
    const params = {
      type: 'generate',
      text: text,
      engine: $('engine').value,
      mode: $('engine').value === 'qwen-tts' ? 'custom' : $('mode').value,
      qwen_model: $('engine').value === 'qwen-tts' ? $('mode').value : '',
      speaker: $('speaker').value,
      language: $('language').value,
      instruct: $('instruct').value,
      attn: 'sdpa',
    };
    _reqStart = performance.now();
    _firstChunk = 0;
    _llmFirst = 0;
    ws.send(JSON.stringify(params));
    log('已发送生成请求 (引擎: ' + $('engine').value + ')', 'info');
  };

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      // PCM float32 音频数据
      if (!_firstChunk) _firstChunk = performance.now();
      const pcm = new Float32Array(event.data);
      playPCM(pcm, sampleRate);
    } else {
      const data = JSON.parse(event.data);
      const t = data.type;
      if (t === 'stream_info') {
        sampleRate = data.sample_rate;
        // 如果采样率变化，重建 AudioContext
        if (audioCtx && audioCtx.sampleRate !== sampleRate) {
          audioCtx.close();
          audioCtx = new AudioContext({ sampleRate });
        }
        log('采样率: ' + sampleRate + 'Hz', 'dim');
      } else if (t === 'stream_start') {
        log('开始生成，共 ' + data.total_chunks + ' 块', 'info');
      } else if (t === 'chunk_start') {
        log('生成块 #' + data.index + ': ' + data.text.substring(0, 30) + '...', 'info');
      } else if (t === 'chunk_end') {
        log('块 #' + data.index + ' 完成 (音频 ' + data.duration.toFixed(1) + 's, 生成 ' + data.gen_time.toFixed(1) + 's)', 'ok');
      } else if (t === 'stream_end') {
        const totalMs = performance.now() - _reqStart;
        const firstMs = _firstChunk ? (_firstChunk - _reqStart) : 0;
        log('全部完成! 音频 ' + data.total_duration.toFixed(1) + 's, 首包 ' + (firstMs/1000).toFixed(1) + 's, 总耗时 ' + (totalMs/1000).toFixed(1) + 's, RTF ' + data.rtf.toFixed(2), 'ok');
        finish();
      } else if (t === 'error') {
        log('错误: ' + data.error, 'err');
        finish();
      }
    }
  };

  ws.onerror = (e) => { log('WebSocket 连接失败', 'err'); finish(); };
  ws.onclose = () => { if (isPlaying) { log('连接已关闭', 'dim'); finish(); } };
}

function stopGenerate() {
  if (ws) { ws.close(); ws = null; }
  nextPlayTime = 0;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  log('已停止', 'dim');
  finish();
}

function finish() {
  isPlaying = false;
  $('btnGenerate').disabled = false;
  $('btnStop').style.display = 'none';
}

// 从 URL 参数填充
const params = new URLSearchParams(window.location.search);
if (params.get('text')) $('text').value = decodeURIComponent(params.get('text'));
if (params.get('engine')) { $('engine').value = params.get('engine'); onEngineChange(); }
if (params.get('mode')) $('mode').value = params.get('mode');
if (params.get('speaker')) $('speaker').value = params.get('speaker');
if (params.get('language')) $('language').value = params.get('language');
if (params.get('instruct')) $('instruct').value = decodeURIComponent(params.get('instruct'));

// 自动生成（URL 带 &auto=1）
if (params.get('auto') === '1') {
  setTimeout(startGenerate, 500);
}

// ── AI 语音对话 ──────────────────────────────────────────────────
let chatWs = null, isChatting = false;

function addChatMsg(role, text) {
  const box = $('chatBox');
  const d = document.createElement('div');
  d.className = 'chat-msg ' + role;
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = role === 'user' ? '你:' : 'AI:';
  d.appendChild(label);
  d.appendChild(document.createTextNode(text));
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function startChat() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || isChatting) return;

  if (isPlaying) { log('请等待当前播放结束', 'err'); return; }

  addChatMsg('user', text);
  input.value = '';

  const wsPort = window.location.port;
  const port = parseInt(wsPort) + 1;
  const wsUrl = 'ws://' + window.location.hostname + ':' + port + '/ws/chat';

  isChatting = true;
  $('btnChat').disabled = true;
  samples = [];
  nextPlayTime = 0;
  drawWaveform();

  // 预初始化 AudioContext
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 24000 });

  chatWs = new WebSocket(wsUrl);
  chatWs.binaryType = 'arraybuffer';
  let sampleRate = 24000;

  chatWs.onopen = () => {
    _reqStart = performance.now();
    _firstChunk = 0;
    _llmFirst = 0;
    chatWs.send(JSON.stringify({
      type: 'chat',
      text: text,
      session_id: _sessionId,
      engine: $('engine').value,
      mode: $('engine').value === 'qwen-tts' ? 'custom' : $('mode').value,
      qwen_model: $('engine').value === 'qwen-tts' ? $('mode').value : '',
      speaker: $('speaker').value,
      language: $('language').value,
      instruct: $('instruct').value,
      attn: 'sdpa',
    }));
  };

  chatWs.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      if (!_firstChunk) _firstChunk = performance.now();
      const pcm = new Float32Array(event.data);
      playPCM(pcm, sampleRate);
    } else {
      const data = JSON.parse(event.data);
      const t = data.type;
      if (t === 'stream_info') {
        sampleRate = data.sample_rate;
        if (audioCtx && audioCtx.sampleRate !== sampleRate) {
          audioCtx.close();
          audioCtx = new AudioContext({ sampleRate });
        }
      } else if (t === 'llm_text') {
        if (!_llmFirst) {
          _llmFirst = performance.now();
          log('LLM 首响应: ' + ((_llmFirst - _reqStart)/1000).toFixed(1) + 's', 'dim');
        }
        addChatMsg('assistant', data.text);
        log('AI: ' + data.text, 'ok');
      } else if (t === 'stream_start') {
        log('语音合成中，共 ' + data.total_chunks + ' 块', 'info');
      } else if (t === 'stream_end') {
        const totalMs = performance.now() - _reqStart;
        const llmMs = _llmFirst ? (_llmFirst - _reqStart) : 0;
        const firstMs = _firstChunk ? (_firstChunk - _reqStart) : 0;
        const ttsMs = _firstChunk && _llmFirst ? (_firstChunk - _llmFirst) : 0;
        log('语音完成! ' + data.total_duration.toFixed(1) + 's | LLM首响应 ' + (llmMs/1000).toFixed(1) + 's, TTS首包 ' + (ttsMs/1000).toFixed(1) + 's, 总耗时 ' + (totalMs/1000).toFixed(1) + 's | RTF ' + (data.rtf || '—'), 'ok');
        finishChat();
      } else if (t === 'error') {
        log('错误: ' + data.error, 'err');
        finishChat();
      }
    }
  };

  chatWs.onerror = () => { log('聊天 WebSocket 连接失败', 'err'); finishChat(); };
  chatWs.onclose = () => { if (isChatting) { finishChat(); } };
}

function finishChat() {
  isChatting = false;
  chatWs = null;
  $('btnChat').disabled = false;
}
</script>
